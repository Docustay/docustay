{{- if not .Values.existingSecret }}
{{- $name := include "docustay.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $keep := dict }}
{{- if $old }}{{- range $k, $v := $old.data }}{{- $_ := set $keep $k ($v | b64dec) }}{{- end }}{{- end }}
{{- $pick := dict }}
{{- range $k, $len := dict "dbPassword" 24 "tokenPepper" 32 "localAuthSecret" 32 "masterKey" 32 "setupToken" 16 "s3AccessKeyId" 12 "s3SecretAccessKey" 32 }}
{{- $given := index $.Values.secrets $k }}
{{- $_ := set $pick $k (default (default (randAlphaNum (int $len)) (index $keep $k)) $given) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "docustay.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $pick }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  resendApiKey: {{ .Values.secrets.resendApiKey | quote }}
{{- end }}
