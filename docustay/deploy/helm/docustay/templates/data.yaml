{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-db
  labels: {{- include "docustay.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels: {{- include "docustay.labels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: docustay }
            - { name: POSTGRES_DB, value: docustay }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "docustay.secretName" . }}, key: dbPassword } }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "docustay", "-d", "docustay"] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-db
  labels: {{- include "docustay.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
  ports: [{ name: pg, port: 5432 }]
{{- end }}
{{- if .Values.storage.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-storage
  labels: {{- include "docustay.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels: {{- include "docustay.labels" . | nindent 8 }}
        app.kubernetes.io/component: storage
    spec:
      containers:
        - name: seaweedfs
          image: "{{ .Values.image.storage }}:{{ .Values.image.tag }}"
          env:
            - { name: KEYSTONE_S3_BUCKET, value: {{ .Values.s3.bucket | quote }} }
            - name: KEYSTONE_S3_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ include "docustay.secretName" . }}, key: s3AccessKeyId } }
            - name: KEYSTONE_S3_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "docustay.secretName" . }}, key: s3SecretAccessKey } }
          ports: [{ name: s3, containerPort: 8333 }]
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-storage
  labels: {{- include "docustay.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
  ports: [{ name: s3, port: 8333 }]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gotenberg
  labels: {{- include "docustay.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gotenberg
  template:
    metadata:
      labels: {{- include "docustay.labels" . | nindent 8 }}
        app.kubernetes.io/component: gotenberg
    spec:
      containers:
        - name: gotenberg
          image: {{ .Values.gotenberg.image }}
          ports: [{ name: http, containerPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gotenberg
  labels: {{- include "docustay.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gotenberg
  ports: [{ name: http, port: 3000 }]
