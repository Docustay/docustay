[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docustay"
version = "0.2.0"
description = "Docustay API client for Python. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
authors = [{ name = "Docustay", email = "support@docustay.app" }]
keywords = ["docustay", "e-signature", "electronic signature", "documents", "api", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://docustay.app"
Documentation = "https://docustay.app/docs"
Issues = "https://docustay.app/contact"

[tool.setuptools]
packages = ["docustay"]
